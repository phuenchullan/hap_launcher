services:
  gateway-db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_GATEWAY_USER}
      POSTGRES_PASSWORD: ${DB_GATEWAY_PASSWORD}
      POSTGRES_DB: ${DB_GATEWAY_NAME}
    volumes:
      - ./data/gateway:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_GATEWAY_USER} -d ${DB_GATEWAY_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - hap

  harvest-db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_HARVEST_USER}
      POSTGRES_PASSWORD: ${DB_HARVEST_PASSWORD}
      POSTGRES_DB: ${DB_HARVEST_NAME}
    volumes:
      - ./data/harvest:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_HARVEST_USER} -d ${DB_HARVEST_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - hap

  hap-files-db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${HAP_FILES_DB_USER}
      POSTGRES_PASSWORD: ${HAP_FILES_DB_PASSWORD}
      POSTGRES_DB: ${HAP_FILES_DB_NAME}
    volumes:
      - ./data/hap-files:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${HAP_FILES_DB_USER} -d ${HAP_FILES_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - hap

  nats:
    image: nats:2.10-alpine
    restart: unless-stopped
    command: ["-js"]
    networks:
      - hap

  hap-files:
    build:
      context: ./hap-files
    image: hap-files:latest
    restart: unless-stopped
    env_file:
      - .env
    environment:
      HAP_FILES_DATABASE_URL: postgres://${HAP_FILES_DB_USER}:${HAP_FILES_DB_PASSWORD}@hap-files-db:5432/${HAP_FILES_DB_NAME}
      HAP_API_KEY: ${HAP_API_KEY}
      BIND_ADDRESS: ${BIND_ADDRESS}
      IMAGES_DIR: ${IMAGES_DIR}
    volumes:
      - ./data/images:/data/images
    depends_on:
      hap-files-db:
        condition: service_healthy
    networks:
      - hap

  ha-harvest-ms:
    build:
      context: ./ha-harvest-ms
    image: ha-harvest-ms:latest
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_HARVEST_PORT: ${DB_HARVEST_PORT}
      DB_HARVEST_USER: ${DB_HARVEST_USER}
      DB_HARVEST_PASSWORD: ${DB_HARVEST_PASSWORD}
      DB_HARVEST_NAME: ${DB_HARVEST_NAME}
      HARVEST_DATABASE_URL: postgresql://${DB_HARVEST_USER}:${DB_HARVEST_PASSWORD}@harvest-db:5432/${DB_HARVEST_NAME}
      NATS_SERVERS: ${NATS_SERVERS}
    depends_on:
      harvest-db:
        condition: service_healthy
      nats:
        condition: service_started
    networks:
      - hap

  ha-gateway:
    build:
      context: ./ha-gateway
    image: ha-gateway:latest
    restart: unless-stopped
    env_file:
      - .env
    environment:
      GATEWAY_PORT: ${GATEWAY_PORT}
      DB_GATEWAY_USER: ${DB_GATEWAY_USER}
      DB_GATEWAY_PASSWORD: ${DB_GATEWAY_PASSWORD}
      DB_GATEWAY_NAME: ${DB_GATEWAY_NAME}
      DATABASE_URL: postgresql://${DB_GATEWAY_USER}:${DB_GATEWAY_PASSWORD}@gateway-db:5432/${DB_GATEWAY_NAME}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN}
      NATS_SERVERS: ${NATS_SERVERS}
      HAP_FILES_URL: ${HAP_FILES_URL}
      HAP_API_KEY: ${HAP_API_KEY}
    depends_on:
      gateway-db:
        condition: service_healthy
      nats:
        condition: service_started
      hap-files:
        condition: service_started
      ha-harvest-ms:
        condition: service_started
    networks:
      - hap

  dashboard:
    build:
      context: ./hap-dashboard
    image: hap-dashboard:latest
    restart: unless-stopped
    networks:
      - hap

  nginx:
    build:
      context: ./nginx
    image: hap-nginx:latest
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - dashboard
      - ha-gateway
      - hap-files
    networks:
      - hap

networks:
  hap:
    driver: bridge
